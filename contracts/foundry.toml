[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
aurora_testnet = "https://testnet.aurora.dev"

[etherscan]
aurora_testnet = { key = "${AURORASCAN_API_KEY}", url = "https://testnet.aurorascan.dev/api" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

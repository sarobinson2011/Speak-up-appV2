[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.22"
evm_version = "paris"

optimizer = true
optimizer_runs = 1
via_ir = false
bytecode_hash = "none"

[rpc_endpoints]
aurora_testnet = "https://testnet.aurora.dev"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"

[etherscan]
aurora_testnet = { key = "${AURORASCAN_API_KEY}", url = "https://testnet.aurorascan.dev/api" }

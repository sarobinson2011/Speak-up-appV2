[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = false

[rpc_endpoints]
aurora_testnet = "https://testnet.aurora.dev"

[etherscan]
aurora_testnet = { key = "${AURORASCAN_API_KEY}", url = "https://testnet.aurorascan.dev/api" }
